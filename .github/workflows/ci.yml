name: CI

on:
  push:
    branches: [main]
  pull_request:
  # the release workflow runs this first
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # the server and tests run on node, node:sqlite needs a recent one
      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and check formatting
        run: bun check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

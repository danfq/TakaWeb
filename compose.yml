services:
  takaweb:
    image: "ghcr.io/danfq/takaweb:latest"
    restart: "unless-stopped"
    depends_on:
      mongo:
        condition: "service_healthy"
      mongo-init:
        condition: "service_completed_successfully"
    environment:
      MONGO_URI: "mongodb://${MONGO_READONLY_USERNAME:-takaweb}:${MONGO_READONLY_PASSWORD:?set MONGO_READONLY_PASSWORD}@mongo:27017/takatime?authSource=admin"
      TAKAWEB_URL: "${TAKAWEB_URL:-http://localhost:4321}"
      TAKAWEB_DATA_DIR: "/data"
    ports:
      - "${TAKAWEB_BIND:-127.0.0.1}:${TAKAWEB_PORT:-4321}:4321"
    volumes:
      - "takaweb-db:/data"
    healthcheck:
      test: ["CMD", "node", "/app/scripts/healthcheck.mjs"]
      interval: "30s"
      timeout: "5s"
      retries: 3

  mongo:
    image: "mongo:8"
    restart: "unless-stopped"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USERNAME:-takatime}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:?set MONGO_PASSWORD}"
    ports:
      - "${MONGO_BIND:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - "mongo-data:/data/db"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "20s"

  mongo-init:
    image: "mongo:8"
    restart: "no"
    depends_on:
      mongo:
        condition: "service_healthy"
    environment:
      MONGO_USERNAME: "${MONGO_USERNAME:-takatime}"
      MONGO_PASSWORD: "${MONGO_PASSWORD:?set MONGO_PASSWORD}"
      MONGO_READONLY_USERNAME: "${MONGO_READONLY_USERNAME:-takaweb}"
      MONGO_READONLY_PASSWORD: "${MONGO_READONLY_PASSWORD:?set MONGO_READONLY_PASSWORD}"
    configs:
      - source: "mongo-readonly-user"
        target: "/mongo-readonly-user.js"
    command: ["mongosh", "--nodb", "--quiet", "/mongo-readonly-user.js"]

configs:
  mongo-readonly-user:
    content: |
      // create or sync the read-only user takaweb connects with, safe to run on every start
      const env = process.env;
      const user = env.MONGO_READONLY_USERNAME;

      // never touch the root user, updating it would strip its roles
      if (!user || user === env.MONGO_USERNAME) {
        throw new Error("MONGO_READONLY_USERNAME must be set and differ from MONGO_USERNAME");
      }

      const admin = connect(
        "mongodb://" +
          encodeURIComponent(env.MONGO_USERNAME) + ":" +
          encodeURIComponent(env.MONGO_PASSWORD) +
          "@mongo:27017/admin?authSource=admin",
      );

      const options = {
        pwd: env.MONGO_READONLY_PASSWORD,
        roles: [{ role: "read", db: "takatime" }],
      };

      if (admin.getUser(user)) {
        admin.updateUser(user, options);
        print("updated read-only user " + user);
      } else {
        admin.createUser({ user: user, ...options });
        print("created read-only user " + user);
      }

volumes:
  takaweb-db:
  mongo-data:

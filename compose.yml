services:
  takaweb:
    image: "ghcr.io/danfq/takaweb:latest"
    restart: "unless-stopped"
    environment:
      MONGO_URI: "${MONGO_URI:?set MONGO_URI}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}"
      TAKAWEB_URL: "${TAKAWEB_URL:-http://localhost:4321}"
      TAKAWEB_ALLOWED_EMAILS: "${TAKAWEB_ALLOWED_EMAILS:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GITLAB_CLIENT_ID: "${GITLAB_CLIENT_ID:-}"
      GITLAB_CLIENT_SECRET: "${GITLAB_CLIENT_SECRET:-}"
      GITLAB_ISSUER: "${GITLAB_ISSUER:-https://gitlab.com}"
    ports:
      - "${TAKAWEB_BIND:-127.0.0.1}:${TAKAWEB_PORT:-4321}:4321"
    volumes:
      - "takaweb-data:/data"
    healthcheck:
      test: ["CMD", "node", "/app/scripts/healthcheck.mjs"]
      interval: "30s"
      timeout: "5s"
      retries: 3

volumes:
  takaweb-data:
